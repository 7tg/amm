[package]
name = "amm"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "net", "sync", "io-util"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["catch-panic"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rmcp = { version = "3.8", features = ["server", "transport-io"] }
ureq = { version = "3", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
libc = "0.2"
regex = "1.13.1"
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic = "abort" is deliberately not set: the daemon relies on catch_panic (unwinding)
# to turn handler panics into 500s. Cargo ignores `panic` for test targets anyway.
