[package]
name = "amm"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time"] }
axum = "0.8"
rmcp = { version = "3.8", features = ["server", "transport-io"] }
ureq = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic = "abort" is deliberately not set: the plan restricts it to the binary
# target, which Cargo profiles cannot express; tests need unwinding.
